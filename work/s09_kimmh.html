<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Box Layout</title>
    <style>
        .pic img {
            width: 100%;
            height: auto;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            gap: 10px;
        }

        .pic {
            flex-basis: 32%;
        }

        @media (min-width : 768px) and (max-width :1024px) {
            .pic {
                flex-basis: 49%;
            }
        }

        @media (max-width : 768px) {
            .pic {
                flex-basis: 100%;
            }

        }
    </style>
</head>

<body>
    <div class="container">
        <div class="pic">
            <img src="./images/kitten-1.jpg" alt="고양이1">
        </div>
        <div class="pic">
            <img src="./images/kitten-2.jpg" alt="고양이2">
        </div>
        <div class="pic">
            <img src="./images/kitten-3.jpg" alt="고양이3">
        </div>
    </div>
</body>

</html>
