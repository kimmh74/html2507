<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>사이드바 홈페이지</title>
  <style>
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      display: flex;
    }
    .sidebar {
      width: 200px;
      background-color: #333;
      color: white;
      height: 100vh;
      padding-top: 20px;
    }
    .sidebar a {
      display: block;
      color: white;
      padding: 12px 20px;
      text-decoration: none;
    }
    .sidebar a:hover {
      background-color: #575757;
    }
    .content {
      flex-grow: 1;
      padding: 20px;
      background-color: #f9f9f9;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <a href="#">홈</a>
    <a href="#">소개</a>
    <a href="#">서비스</a>
    <a href="#">포트폴리오</a>
    <a href="#">연락처</a>
  </div>
  <div class="content">
    <h1>환영합니다!</h1>
    <p>이곳은 사이드바를 포함한 간단한 홈페이지입니다.</p>
  </div>
</body>
</html>
