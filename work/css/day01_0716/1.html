<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>시멘틱 aside 예시</title>
</head>
<body>
    <article>
        <h1></h1>
        <p>이것은 본문의 주요 내용입니다.</p>
        <!-- aside는 부가적 정보나 관련 내용을 제공하는 역할입니다 -->
        <aside>
            <h2>관련 정보</h2>
            <p>이것은 부가적인 정보입니다.</p>
        </aside>
    </article>
</body>
</html>
