<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript에서 id로 요소 접근하기</title>
</head>

<body>
    <h2>JS에서 ID로 요소 접근하기</h2>
    <p><b>JavaScript에서 getElememtById()메서드를 사용하여<br>
        지정된 ID를 가진요소에 액세스 할 수 있다</b></p>
    <h1 id="myHeader">안녕하세요!</h1>
    <button onclick="displayResult()">어떻게 바뀔까?</button>
    <script>
        function displayResult() {
            document.getElementById("myHeader").innerHTML = "즐거운 하루되세요!!!!";
        }
    </script>

</body>

</html>
