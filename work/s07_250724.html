<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>사이드바 홈페이지</title>
    <style>
        h1 {
            text-align: center;
        }

        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            /* display: inline-block; */
        }

        .sidebar {
            width: 200px;
            background-color: #333;
            color: white;
            height: 100vh;
            padding-top: 20px;
            float:left ;
        }

        .sidebar a {
            display: block;
            color: white;
            padding: 12px 20px;
            text-decoration: none;
        }

        .sidebar a:hover {
            background-color: #575757;
        }

        .content {

            background-color: #e2860d;
        }

        /* .sidebar {
           float: left;
        } */

        .body {
            width: 100%;
            border: 1px;

        }
    </style>
</head>

<body>
    <h1> 나의 홈페이지</h1>
    <div class="body">
        <div class="sidebar">
            <a href="#">홈</a>
            <a href="#">소개</a>
            <a href="#">서비스</a>
            <a href="#">포트폴리오</a>
            <a href="#">연락처</a>
        </div>
        <div class="content">
            <h1>환영합니다!</h1>
            <p>이곳은 사이드바를 포함한 간단한 홈페이지입니다.</p>
        </div>
    </div>
</body>

</html>
